<title>박정우 포트폴리오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 일본어 제목용 보조 폰트 (Pretendard에 없는 가나·한자만 여기서 가져옴) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ======================================================================
   이 파일은 사이트의 모양과 동작입니다. 내용은 content.js에서 고치세요.
   ====================================================================== */
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}

/* Layout: oversized wordmark, 12-column editorial grid with labels in a narrow left column.
   Pure black and white; greys only for hierarchy. Thumbnails stay grayscale until hovered. */
:root{
  --bg:#0A0A0A; --fg:#F4F4F4; --muted:#8F8F8F; --line:#242424; --tile:#171717; --tile-fg:#5E5E5E; --stage:#141414;
  color-scheme:dark;
  --paper:#FFFFFF; --ink:#0A0A0A; --ink-2:#5C5C5C; --rule:#D9D9D9;
  --font:"Pretendard","Noto Sans JP",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --max:1440px; --gut:max(24px, env(safe-area-inset-left, 0px)); --gut-r:max(24px, env(safe-area-inset-right, 0px));
}

body{word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--gut);padding-right:var(--gut-r)}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.u:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--bg)}
header .wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:center;min-height:56px;font-size:14px}
.mark{grid-column:1 / 4;font-weight:600}
.h-role{grid-column:4 / 8;color:var(--muted)}
nav.main{grid-column:8 / 13;display:flex;justify-content:flex-end;gap:28px}
nav.main a{color:var(--muted)}
nav.main a:hover{color:var(--fg)}

/* ---------- hero ---------- */
.hero{padding-block:clamp(48px,9vw,120px) 0}
.word{margin:0;font-weight:700;font-size:clamp(52px,13.2vw,200px);line-height:.86;letter-spacing:-.055em;text-transform:uppercase;text-wrap:balance}
.hero-meta{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;margin-top:clamp(32px,5vw,64px);padding-block:20px 0;border-top:1px solid var(--fg)}
.hero-meta .who{grid-column:1 / 4;font-weight:600;font-size:16px}
.hero-meta .who span{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.hero-meta .say{grid-column:4 / 10;margin:0;font-size:clamp(17px,1.6vw,21px);line-height:1.6;max-width:30em;text-wrap:pretty}
.hero-meta .say p{margin:0}
.hero-meta .say .skills{margin-top:4px;font-size:14px;color:var(--muted)}
.hero-meta .go.contact{display:grid;grid-template-columns:auto auto;gap:4px 16px;align-items:baseline;justify-items:start}
.hero-meta .contact .k{color:var(--muted);font-size:13px}
.hero-meta .say .skills:empty{display:none}
.hero-meta .go{grid-column:10 / 13;justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:14px}

/* ---------- sections ---------- */
section{padding-block:clamp(88px,10vw,140px) 0}
.sec-head{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:baseline;padding-bottom:14px;margin-bottom:32px;border-bottom:1px solid var(--fg)}
.sec-head h2{grid-column:1 / 4;margin:0;font-size:14px;font-weight:600}
.sec-head .note{grid-column:4 / 10;font-size:14px;color:var(--muted)}
.sec-head .tools{grid-column:10 / 13;justify-self:end;display:flex;gap:4px}
.split{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.split > .body{grid-column:4 / 13;min-width:0}

/* ---------- work grid ---------- */
.grid{display:grid;gap:56px 20px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.two .feature{grid-column:1 / -1}
.grid.cols{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));grid-auto-flow:row dense;gap:40px 20px}
.grid.cols .big{grid-column:span 2;grid-row:span 2}
.tile{display:flex;flex-direction:column;gap:12px;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--tile);overflow:hidden}
.feature .thumb{aspect-ratio:21/9}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .45s ease,transform .6s ease}
a.tile:hover img{filter:grayscale(0);transform:scale(1.02)}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tile-fg);text-align:center;padding:12px}
a.tile:hover .t{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.t{font-weight:600;font-size:17px;line-height:1.35;min-width:0}
.feature .t{font-size:clamp(20px,2vw,26px);font-weight:700;letter-spacing:-.02em}
.cols .t{font-size:15px}
.cols .big .t{font-size:clamp(18px,1.6vw,22px);font-weight:700;letter-spacing:-.02em}
.y{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.m{margin-top:-8px;font-size:13.5px;color:var(--muted)}

/* 여러 편으로 된 작업: 상세 화면 안에서 편 고르기 */
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.eps.grouped{display:flex;gap:0;align-items:stretch}
.ep-group{display:flex;flex-direction:column;gap:10px;min-width:0}
.ep-group+.ep-group{border-left:1px solid var(--line);margin-left:20px;padding-left:20px}
.ep-glabel{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--fg)}
.ep-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.ep .er{font-size:12px;color:var(--muted)}
.ep{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;opacity:.45;transition:opacity .2s ease;min-width:0}
.ep:hover,.ep[aria-pressed="true"]{opacity:1}
.ep[aria-pressed="true"] .thumb img{filter:none}
.ep .thumb.v img{object-fit:contain}
.ep .et{font-size:13px;line-height:1.4}
.ep[aria-pressed="true"] .et{font-weight:600}

/* ---------- index view ---------- */
.index{display:block}
.index-row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:baseline;padding-block:16px;border-bottom:1px solid var(--line);font-size:15px;transition:opacity .2s ease}
.index-row .c1{grid-column:1 / 3;color:var(--muted);font-size:13px;min-width:0}
.index-row .c2{grid-column:3 / 8;font-weight:600;font-size:clamp(16px,1.5vw,19px);letter-spacing:-.015em;min-width:0}
.index-row .c3{grid-column:8 / 11;color:var(--muted);min-width:0}
.index-row .c4{grid-column:11 / 13;color:var(--muted);text-align:right;min-width:0;font-variant-numeric:tabular-nums;font-size:13px}
.index:hover .index-row{opacity:.3}
.index .index-row:hover{opacity:1}
.peek{position:fixed;left:0;top:0;width:320px;aspect-ratio:16/9;pointer-events:none;z-index:8;background:var(--tile);overflow:hidden;opacity:0;transition:opacity .15s ease}
.peek img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.peek.on{opacity:1}

/* ---------- archive / about / download ---------- */
.row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:20px;align-items:baseline;padding-block:14px;border-bottom:1px solid var(--line);font-size:14px}
.row .yr{grid-column:1 / 2;color:var(--muted);font-variant-numeric:tabular-nums}
.row .ti{grid-column:2 / 6;font-weight:500;min-width:0}
.row .fm{grid-column:6 / 8;color:var(--muted);min-width:0}
.row .rl{grid-column:8 / 9;color:var(--muted);min-width:0}
.row .go{grid-column:9 / 10;text-align:right;font-size:13px}

.about{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.about h3{margin:0 0 16px;font-size:13px;font-weight:500;color:var(--muted)}
.about ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
.about li span{display:block;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.about li small{display:block;margin-top:2px;color:var(--muted);font-size:13px}

.doc{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:20px;align-items:center;padding-block:22px;border-bottom:1px solid var(--line)}
.doc:first-child{padding-top:0}
.doc .ko{grid-column:1 / 4;font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.35}
.doc .en{display:block;font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0;margin-top:2px}
.doc .ds{grid-column:4 / 8;font-size:14px;color:var(--muted)}
.doc .btn{grid-column:8 / 10;justify-self:end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 20px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:transparent;color:var(--fg)}

footer{margin-top:clamp(88px,10vw,140px);border-top:1px solid var(--fg)}
footer .wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;padding-block:24px 48px;font-size:14px}
footer .mailbox{grid-column:1 / 7}
footer .mail{font-weight:600;user-select:all}
footer .cr{grid-column:7 / 13;justify-self:end;color:var(--muted)}
.copy{background:none;border:0;padding:0 0 0 12px;font:inherit;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- detail dialog ---------- */
dialog{border:0;padding:0;background:var(--bg);color:var(--fg);width:min(1180px, calc(100vw - 32px));max-width:none;max-height:calc(100vh - 48px);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.8)}
.d-in{padding:28px 32px 40px;display:flex;flex-direction:column;gap:24px}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--fg)}
.d-head h2{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.25;text-wrap:balance}
.d-meta{margin:6px 0 0;font-size:14px;color:var(--muted)}
.d-close{flex:none;background:none;border:0;font:inherit;font-size:14px;color:var(--fg);cursor:pointer;min-height:44px;padding:0 4px}
.d-close:hover{text-decoration:underline;text-underline-offset:3px}
.player{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--tile);overflow:hidden}
.player iframe,.player img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.player.v img{object-fit:contain}
/* 상세 화면: 내 역할과 맡은 일 */
.part{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px 20px;font-size:15px;line-height:1.65}
.part:empty{display:none}
.part .lab{grid-column:1 / 3;font-size:13px;color:var(--muted);padding-top:2px}
.part .val{grid-column:3 / 13;min-width:0}
.part .val.role{font-weight:600}
.part ul{margin:0;padding-left:1.1em}
.part .focus{margin:0 0 6px;font-weight:600}
.part .val.cr{color:var(--muted);font-size:14px}
.part .files{display:flex;flex-wrap:wrap;gap:6px 20px}
.part .files a{text-decoration:underline;text-underline-offset:3px}
/* 상세 화면: 메인 영상(왼쪽) + 옆에 세로로 쌓은 스틸컷 / 다른 편 — 메인 영상 높이를 넘지 않음 */
.media{display:grid;grid-template-columns:var(--main-w,3fr) var(--side-w,1fr);gap:10px;align-items:stretch}
.media.solo{grid-template-columns:minmax(0,1fr);max-width:800px}
.media.solo .side{display:none}
.side{display:grid;gap:8px;grid-template-columns:repeat(var(--c,1),minmax(0,1fr));grid-template-rows:repeat(var(--r,1),minmax(0,1fr));min-width:0;min-height:0}
.side .cell{position:relative;display:block;width:auto;aspect-ratio:auto;min-height:0;padding:0;border:0;background:var(--tile);overflow:hidden;cursor:pointer}
.side .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.side .cell.v img{object-fit:contain}
.side .cell .et{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 6px;font-size:12px;line-height:1.3;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.side .cell:hover img{opacity:.85}
.part.d-about:has(.d-desc:empty){display:none}
.player .out{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tile-fg)}
.d-desc{margin:0;max-width:44em;font-size:15px;line-height:1.75;text-align:justify;text-justify:inter-character;white-space:pre-line}
.d-label{margin:8px 0 0;font-size:13px;font-weight:500;color:var(--muted)}
.stills{display:grid;gap:12px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.gal{display:flex;flex-direction:column;gap:24px}
.gal:empty{display:none}
.gal-set{display:flex;flex-direction:column;gap:12px}
.gal-set .d-label{margin:0}
.shot{display:flex;flex-direction:column;gap:6px;min-width:0}
.still{position:relative;display:block;width:100%;aspect-ratio:16/9;max-width:100%;padding:0;border:0;background:var(--tile);overflow:hidden;cursor:zoom-in}
.still img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;transition:opacity .2s ease}
.still:hover img{opacity:.85}
.still.doc{aspect-ratio:4/3}
.still.doc img{object-fit:contain}
.shot-cap{font-size:13px;color:var(--muted);line-height:1.4}
/* 크게 보기 */
#lightbox{border:0;padding:0;background:transparent;width:100vw;height:100vh;max-width:none;max-height:none}
#lightbox::backdrop{background:rgba(0,0,0,.92)}
.lb{box-sizing:border-box;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px))}
.lb img{max-width:100%;max-height:calc(100% - 40px);object-fit:contain;cursor:zoom-out}
.lb p{margin:0;color:#D8D8D8;font-size:14px}
.lb p:empty{display:none}
.lb .lb-count{font-size:12px;color:#8F8F8F;font-variant-numeric:tabular-nums}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:96px;border:0;background:none;color:#F4F4F4;font:300 48px/1 var(--font);cursor:pointer;opacity:.55;transition:opacity .2s ease}
.lb-nav:hover{opacity:1}
.lb-nav.prev{left:max(4px, env(safe-area-inset-left, 0px))}
.lb-nav.next{right:max(4px, env(safe-area-inset-right, 0px))}
.lb-nav[hidden]{display:none}
.lb-close{position:absolute;top:calc(12px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));min-height:44px;padding:0 4px;border:0;background:none;color:#F4F4F4;font:inherit;font-size:14px;cursor:pointer}

/* ---------- document view (이력서 · 경력기술서 · 포트폴리오) ---------- */
#docView{background:var(--stage);min-height:100vh}
.doc-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:12px;position:sticky;top:env(safe-area-inset-top, 0px);background:var(--stage);z-index:5}
.doc-bar .back{font-size:14px;color:var(--muted)}
.doc-bar .back:hover{color:var(--fg)}
.doc-tabs{display:flex;gap:4px}
.doc-tabs a{font-size:14px;padding:10px 14px;color:var(--muted)}
.doc-tabs a[aria-current="page"]{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--fg)}
.doc-note{font-size:13px;color:var(--muted)}
.stage{overflow-x:auto;padding:8px var(--gut-r) 64px var(--gut)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:24px;min-width:min-content}

.sheet{width:210mm;min-height:297mm;box-sizing:border-box;padding:16mm 17mm;background:var(--paper);color:var(--ink);font-size:9.5pt;line-height:1.55;letter-spacing:-.01em;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.sheet.land{width:297mm;min-height:210mm;height:210mm;padding:13mm 15mm;overflow:hidden;--paper:#0A0A0A;--ink:#F4F4F4;--ink-2:#9A9A9A;--rule:#2E2E2E;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet.land .ph-paper,.sheet.land .p-main,.sheet.land .p-sm{background:#1A1A1A;color:#6A6A6A}
.sheet.land .todo{color:#6A6A6A}
.sheet h3{margin:0;font-size:8pt;font-weight:600;color:var(--ink)}
.ph-paper{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:8pt;color:#9A9A9A;background:#F0F0F0}
.todo{color:#A0A0A0}

/* 이력서 */
.r-word{font-size:34pt;font-weight:700;letter-spacing:-.05em;line-height:.9;text-transform:uppercase}
.r-top{display:grid;grid-template-columns:42mm minmax(0,1fr) auto;gap:6mm;align-items:end;margin-top:7mm;padding-bottom:4mm;border-bottom:1pt solid var(--ink)}
.r-name{font-size:12pt;font-weight:700}
.r-sub{font-size:8.5pt;color:var(--ink-2)}
.r-contact{text-align:right;font-size:8.5pt;line-height:1.65;color:var(--ink-2)}
.r-sec{display:grid;grid-template-columns:42mm minmax(0,1fr);gap:6mm;padding-block:5mm;border-bottom:.5pt solid var(--rule)}
.r-sec:last-child{border-bottom:0}
.r-rows{display:flex;flex-direction:column;gap:1.8mm}
.r-row{display:grid;grid-template-columns:30mm minmax(0,1fr) auto;gap:4mm;align-items:baseline}
.r-row .d{color:var(--ink-2);font-size:8.5pt;font-variant-numeric:tabular-nums}
.r-row .x{color:var(--ink-2);font-size:8.5pt;text-align:right}
.r-row b{font-weight:600}
.r-row .s{display:block;color:var(--ink-2);font-size:8.5pt}

/* 경력기술서 */
.c-top{display:grid;grid-template-columns:42mm minmax(0,1fr) auto;gap:6mm;align-items:end;padding-bottom:4mm;border-bottom:1pt solid var(--ink)}
.c-title{grid-column:1 / 3;font-size:26pt;font-weight:700;letter-spacing:-.045em;line-height:1}
.c-who{text-align:right;font-size:8.5pt;line-height:1.65;color:var(--ink-2)}
.c-group{display:grid;grid-template-columns:42mm minmax(0,1fr);gap:6mm;padding-top:6mm}
.c-group > h3{padding-top:5mm}
.c-entry{padding-block:5mm;border-bottom:.5pt solid var(--rule);break-inside:avoid}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:6mm}
.c-head b{font-size:11.5pt;font-weight:700;letter-spacing:-.02em}
.c-head span{font-size:8.5pt;color:var(--ink-2);font-variant-numeric:tabular-nums;flex:none}
.c-meta{margin-top:1mm;font-size:8.5pt;color:var(--ink-2)}
.c-body{display:grid;grid-template-columns:18mm minmax(0,1fr);gap:1.5mm 4mm;margin:3mm 0 0}
.c-body dt{font-size:8pt;color:var(--ink-2);padding-top:.3mm}
.c-body dd{margin:0}
.c-body ul{margin:0;padding-left:4mm}
.c-body li{margin-bottom:.8mm}
.r-p{margin:0 0 2.5mm;line-height:1.75}
.r-p:last-child{margin-bottom:0}
.p-text .part{display:block;font-size:8.5pt;line-height:1.6}
.p-text .part b{display:block;font-size:7.5pt;font-weight:600;color:var(--ink-2);margin-bottom:1mm}
.p-text .part ul{margin:0;padding-left:3.5mm}
.p-text .part .focus{margin:0 0 1mm;font-weight:600;font-size:8.5pt}
.c-focus{display:block;font-weight:600;margin-bottom:1mm}
.p-text .cr{font-size:7.5pt;color:var(--ink-2)}
.c-list .r-rows{padding-top:5mm}

/* 포트폴리오 */
.p-cover{display:flex;flex-direction:column;justify-content:space-between;height:100%}
.p-cover .k{display:flex;justify-content:space-between;font-size:9pt;color:var(--ink-2)}
.p-cover .n{font-size:68pt;font-weight:700;letter-spacing:-.055em;line-height:.86;text-transform:uppercase}
.p-cover .c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6mm;font-size:9pt;border-top:1pt solid var(--ink);padding-top:3mm}
.p-cover .c span:first-child{font-weight:700}
.p-page{display:grid;grid-template-columns:78mm minmax(0,1fr);gap:10mm;height:100%}
.p-text{display:flex;flex-direction:column;gap:3mm;min-width:0;border-top:1pt solid var(--ink);padding-top:3mm}
.p-text .ttl{font-size:20pt;font-weight:700;letter-spacing:-.04em;line-height:1.15}
.p-text .meta{display:grid;grid-template-columns:16mm minmax(0,1fr);gap:1mm 3mm;font-size:8.5pt;margin-top:2mm}
.p-text .meta span:nth-child(odd){color:var(--ink-2)}
.p-text .desc:has(.todo){text-align:left}
.p-text .desc{margin-top:4mm;font-size:9pt;line-height:1.75;text-align:justify;text-justify:inter-character;white-space:pre-line}
.p-text .link{margin-top:auto;font-size:7.5pt;color:var(--ink-2);word-break:break-all}
.p-media{display:flex;flex-direction:column;gap:3mm;min-width:0}
.p-main,.p-sm{position:relative;aspect-ratio:16/9;background:#F0F0F0;overflow:hidden}
.p-main img,.p-sm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.p-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3mm}
.p-eps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4mm 3mm}
.p-grid{display:grid;gap:3mm}
.sheet.land .p-fit{background:#141414}
.p-fit img{object-fit:contain;object-position:center}
.p-c .p-cap{position:absolute;left:0;right:0;bottom:0;padding:5mm 2.2mm 1.6mm;font-size:7pt;font-weight:600;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.p-main.p-c .p-cap{font-size:8pt;padding:7mm 3mm 2.2mm}
.p-ep{display:flex;flex-direction:column;gap:1.5mm;font-size:8pt}
.p-ep b{font-weight:600}

body.doc-mode header, body.doc-mode main, body.doc-mode footer{display:none}

@media (max-width:960px){
  .h-role{display:none}
  .mark{grid-column:1 / 6}
  nav.main{grid-column:6 / 13}
  .hero-meta .who{grid-column:1 / 13}
  .hero-meta .say{grid-column:1 / 13}
  .part .lab,.part .val{grid-column:1 / 13}
  .part .val{margin-top:-6px}
  .hero-meta .go{grid-column:1 / 13;justify-self:start;align-items:flex-start}
  .sec-head h2{grid-column:1 / 7}
  .sec-head .note{display:none}
  .sec-head .tools{grid-column:7 / 13}
  .split > .body{grid-column:1 / 13}
  .grid.cols{grid-template-columns:repeat(var(--cols-s,2),minmax(0,1fr))}
  .about{grid-template-columns:1fr;gap:36px}
  .index-row{row-gap:4px}
  .index-row .c1{grid-column:1 / 9;grid-row:1}
  .index-row .c4{grid-column:9 / 13;grid-row:1}
  .index-row .c2{grid-column:1 / 13}
  .index-row .c3{grid-column:1 / 13}
  .row{grid-template-columns:52px minmax(0,1fr) auto;gap:2px 16px}
  .row .yr{grid-column:1}.row .ti{grid-column:2}.row .fm,.row .rl{grid-column:2}
  .row .go{grid-column:3;grid-row:1}
  .doc{grid-template-columns:minmax(0,1fr) auto}
  .doc .ko{grid-column:1}.doc .ds{grid-column:1;grid-row:2}.doc .btn{grid-column:2;grid-row:1 / 3}
}
@media (max-width:640px){
  header .wrap{gap:12px}
  nav.main{gap:18px}
  .grid.two{grid-template-columns:1fr}
  .feature .thumb{aspect-ratio:16/9}
  .series-head .t,.series-head .m{grid-column:1 / 13;justify-self:start}
  .doc{grid-template-columns:1fr}
  .doc .btn{grid-column:1;grid-row:auto;justify-self:start}
  footer .mailbox,footer .cr{grid-column:1 / 13;justify-self:start}
  dialog{width:100vw;max-height:100vh;height:100%}
  .d-in{padding:20px var(--gut-r) 32px var(--gut)}
  .stills{gap:6px}
  .eps{grid-template-columns:repeat(2,minmax(0,1fr))}

  .ep-group+.ep-group{border-left:0;margin-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .ep-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .media,.media.solo{grid-template-columns:minmax(0,1fr);max-width:none}
  .side{grid-template-rows:none;grid-template-columns:repeat(var(--mc,3),minmax(0,1fr))}
  .side .cell{aspect-ratio:var(--ar,16/9)}
}
@media (prefers-reduced-motion: reduce){.thumb img,.index-row,.peek{transition:none}a.tile:hover img{transform:none}}

@media print{
  html,body{margin:0;padding:0}
  body{background:#fff}
  .peek{display:none}
  body::before{display:none}
  .doc-bar{display:none}
  #docView,.stage{background:#fff;padding:0;overflow:visible;min-height:0}
  .sheets{gap:0;display:block}

  .sheet+.sheet{break-before:page}

  .sheet.land .p-cover,.sheet.land .p-page{height:100%}
}

<!-- content.js를 매번 새로 불러와서, 수정한 내용이 브라우저 캐시 때문에 늦게 보이지 않게 함 -->
<script>document.write('<script src="content.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
const S = window.SITE;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ytUrl = id => "https://www.youtube.com/watch?v=" + id;
/* 유튜브 썸네일은 가장 선명한 1280px(maxres)부터 시도하고, 없으면 한 단계씩 낮춤 */
const YTQ = ["maxresdefault", "sddefault", "hqdefault"];
const ytThumb = id => "https://i.ytimg.com/vi/" + id + "/" + YTQ[0] + ".jpg";
const linkOf = w => w.yt ? ytUrl(w.yt) : (w.href || "");
const imageOf = w => w.thumb || (w.yt ? ytThumb(w.yt) : "") || (w.stills && w.stills[0])
  || (w.episodes ? (w.episodes.map(e => imageOf(e)).find(Boolean) || "") : "");
const join = a => a.filter(Boolean).join(" · ");
let framed = false;
try { framed = window.self !== window.top; } catch (e) { framed = true; }

const DOCS = [
  { id: "resume", ko: "이력서", en: "Resume", desc: (S.downloads || {}).resume || "", page: "@page{size:A4;margin:16mm 17mm}" },
  { id: "career", ko: "경력기술서", en: "Career Description", desc: (S.downloads || {}).career || "", page: "@page{size:A4;margin:16mm 17mm}" },
  { id: "portfolio", ko: "포트폴리오", en: "Portfolio", desc: (S.downloads || {}).portfolio || "", page: "@page{size:A4 landscape;margin:0}" }
];

const lookup = ref => { const [set, i] = ref.split(":"); return S[set][i]; };
/* 사이트에는 기간 대신 연도만, 진행 중이면 "2026 (WIP)" */
const yr = w => (w.year || "") + ((w.wip || /WIP/.test(w.period || "")) ? " (WIP)" : "");
/* 상업 작업 → 자체 제작 순으로 전체 작업 */
const works = () => [...(S.commercial || []), ...(S.original || [])];
/* 사이트 목록 정렬용: period의 마지막 날짜(YYYY.MM), WIP는 맨 위 */
const endKey = w => {
  if (/WIP/.test(w.period || "")) return 999999;
  const d = (w.period || w.year || "").match(/\d{4}(?:\.\d{2})?/g) || [];
  const last = d[d.length - 1] || "0";
  const [y, m] = last.split(".");
  return Number(y) * 100 + Number(m || 0);
};
const sortedWorks = () => ["commercial", "original"]
  .flatMap(set => (S[set] || []).map((w, i) => [set + ":" + i, w]))
  .map((r, n) => [r, n]).sort((a, b) => endKey(b[0][1]) - endKey(a[0][1]) || a[1] - b[1]).map(x => x[0]);
function stepDown(img) {
  const m = img.src.match(/i\.ytimg\.com\/vi\/([^/]+)\/(\w+)\.jpg/);
  const k = m ? YTQ.indexOf(m[2]) : -1;
  if (k > -1 && k < YTQ.length - 1) img.src = "https://i.ytimg.com/vi/" + m[1] + "/" + YTQ[k + 1] + ".jpg";
  else img.remove();
}
function wireImg(img) {
  if (!img) return;
  img.addEventListener("error", () => stepDown(img));
  // 고화질 썸네일이 없는 영상은 유튜브가 120px짜리 회색 이미지를 주므로 그때도 한 단계 낮춤
  img.addEventListener("load", () => { if (img.naturalWidth <= 120 && /i\.ytimg\.com/.test(img.src)) stepDown(img); });
}
const noImgOnError = root => root.querySelectorAll("img").forEach(wireImg);
const colsOf = n => Math.max(1, Math.min(6, parseInt(n, 10) || 4));
const colsStyle = n => `--cols:${colsOf(n)};--cols-s:${colsOf(n) === 1 ? 1 : 2}`;

/* ============ 사이트 ============ */
function tile(w, ref, meta, cls) {
  const img = imageOf(w);
  return `<a class="tile${cls ? " " + cls : ""}" href="${esc(linkOf(w) || "#work")}" target="_blank" rel="noopener" data-ref="${ref}">
    <div class="thumb"><span class="ph">${esc(w.note || w.platform || w.format)}</span>${img ? `<img alt="" loading="lazy" src="${esc(img)}"${!w.thumb && w.thumbZoom ? ` style="transform:scale(${w.thumbZoom})"` : ""}>` : ""}</div>
    <div class="cap"><div class="t">${esc(w.title)}</div><div class="y">${esc(w.platform || yr(w))}</div></div>
    ${meta ? `<div class="m">${esc(meta)}</div>` : ""}</a>`;
}

function renderSite() {
  $("mark").textContent = S.nameEn;
  $("word").innerHTML = esc(S.nameEn).replace(" ", "<br>");
  $("who").innerHTML = `${esc(S.name)}<span>${esc(S.role)}</span>`;
  $("introText").textContent = S.intro;
  $("skills").textContent = (S.skills || []).filter(Boolean).join("  ·  ");
  /* 연락처: 라벨 + 값 두 줄 */
  $("contact").innerHTML = [
    ["Email", S.email, S.email && "mailto:" + S.email],
    ["Instagram", S.instagram && "@" + S.instagram, S.instagram && "https://www.instagram.com/" + S.instagram + "/"]
  ].filter(r => r[1]).map(([k, v, h]) => `<span class="k">${k}</span><a class="u" href="${esc(h)}" target="_blank" rel="noopener">${esc(v)}</a>`).join("");
  $("copyright").textContent = "© " + new Date().getFullYear() + " " + S.nameEn;

  /* Selected Work: commercial + original, 진행 중 → 최근 순 */
  const all = sortedWorks();
  $("indexList").innerHTML = all.map(([ref, w]) => `
    <a class="index-row tile-link" href="${esc(linkOf(w) || "#work")}" target="_blank" rel="noopener" data-ref="${ref}" data-img="${esc(imageOf(w))}">
      <span class="c1">${esc(w.format)}</span><span class="c2">${esc(w.title)}</span><span class="c3">${esc(w.client)}</span><span class="c4">${esc(yr(w))}</span>
    </a>`).join("");

  $("archiveList").innerHTML = S.archive.map(a => {
    const href = linkOf(a);
    return `<div class="row"><span class="yr">${esc(yr(a))}</span><span class="ti">${esc(a.title)}</span><span class="fm">${esc(a.format)}</span><span class="rl">${esc(a.role)}</span>${href ? `<a class="go u" href="${esc(href)}" target="_blank" rel="noopener">Watch ↗</a>` : `<span class="go"></span>`}</div>`;
  }).join("");

  const about = [
    ["Education", S.education.map(e => ["", join([e.school, e.major]), [e.second && "복수전공 / " + e.second, e.gpa && "GPA " + e.gpa]])],
    ["Awards", S.awards.map(a => [a.year, a.name + " · " + a.detail.split(" · ")[0]])],
    ["Certificates", S.certificates.filter(c => c.onSite).map(c => ["", c.detail && c.detail.endsWith("점") ? c.name + " " + c.detail.replace("점", "") : c.name])]
  ];
  $("aboutGrid").innerHTML = about.map(([h, items]) =>
    `<div><h3>${h}</h3><ul>${items.map(([y, t, subs]) => `<li>${y ? `<span>${esc(y)}</span>` : ""}${esc(t)}${(subs || []).filter(Boolean).map(s => `<small>${esc(s)}</small>`).join("")}</li>`).join("")}</ul></div>`).join("");

  const label = framed ? "Preview" : "Download";
  $("docList").innerHTML = DOCS.map(d => `
    <div class="doc">
      <div class="ko">${d.en}<span class="en">${d.ko}</span></div>
      <div class="ds">${d.desc}</div>
      <a class="btn" href="#${d.id}" data-print="1">${label} <span aria-hidden="true">↓</span></a>
    </div>`).join("");

  noImgOnError(document.querySelector("main"));
}

/* Index에서 마우스를 올리면 썸네일 미리보기 */
const peek = $("peek");
if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
  document.addEventListener("mousemove", e => {
    const row = e.target.closest(".index-row");
    const src = row && row.dataset.img;
    if (!src) { peek.classList.remove("on"); return; }
    if (peek.dataset.src !== src) {
      peek.dataset.src = src;
      peek.innerHTML = `<img alt="" src="${esc(src)}">`;
      wireImg(peek.querySelector("img"));
    }
    const x = Math.min(e.clientX + 24, window.innerWidth - 340), y = Math.min(e.clientY + 16, window.innerHeight - 200);
    peek.style.transform = `translate(${x}px, ${y}px)`;
    peek.classList.add("on");
  });
}

/* ============ 작업 상세 화면 ============ */
const dlg = $("detail"), dPlayer = $("dPlayer");
const lb = $("lightbox");
/* 사진 항목은 "경로" 또는 { src: "경로", caption: "설명" } 둘 다 받음 */
const pic = x => !x ? null : (typeof x === "string" ? { src: x, caption: "" } : x);
function openDetail(w) {
  $("dTitle").textContent = w.title;
  $("dMeta").textContent = join([w.client, w.format, yr(w)]);
  renderPart(w);
  const eps = $("dEps");
  eps.hidden = true; eps.innerHTML = "";
  if (w.episodes) {
    /* 편마다 스틸컷이 있으면(YeahFilms 등) 위에서 편을 고르고 옆에는 그 편의 스틸컷,
       스틸컷 없이 영상만 여러 편이면 옆에 다른 편을 놓고 누르면 그 편의 링크(인스타그램 등)로 바로 이동 */
    if (w.picker || w.episodes.some(e => e.stills && e.stills.length)) {
      eps.hidden = false;
      const btn = (ep, k) => {
        const img = imageOf(ep);
        return `<button class="ep" type="button" aria-pressed="false" data-k="${k}"><div class="thumb${ep.vertical ? " v" : ""}"><span class="ph">${esc((ep.yt || ep.href) ? (ep.platform || ep.format || "") : (w.note || "공개 예정"))}</span>${img ? `<img alt="" src="${esc(img)}">` : ""}</div><span class="et">${esc(ep.title)}</span>${ep.role || ep.year ? `<span class="er">${esc(join([ep.role, ep.year]))}</span>` : ""}</button>`;
      };
      const all = w.episodes.map((ep, k) => [ep, k]);
      if (w.groups) {
        /* 유형별로 묶고 사이에 구분선, 각 묶음 맨 앞 위에 유형 이름 */
        const names = [...new Set(w.episodes.map(e => e.group || ""))];
        eps.classList.add("grouped");
        eps.innerHTML = names.map(n => { const list = all.filter(([e]) => (e.group || "") === n);
          return `<div class="ep-group" style="flex:${list.length} 1 0;--n:${list.length}"><p class="ep-glabel">${esc(n)}</p><div class="ep-row">${list.map(([e, k]) => btn(e, k)).join("")}</div></div>`; }).join("");
      } else {
        eps.classList.remove("grouped");
        eps.innerHTML = all.map(([e, k]) => btn(e, k)).join("");
      }
      noImgOnError(eps);
      const btns = [...eps.querySelectorAll(".ep")];
      const pick = k => {
        btns.forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.k) === k)));
        const ep = w.episodes[k], grp = w.groups && w.groups[ep.group];
        const base = grp ? { ...w, ...Object.fromEntries(Object.entries(grp).filter(([, v]) => v && (!Array.isArray(v) || v.length))) } : w;
        if (w.groups) renderPart(base);
        showMedia(ep, base, null);
      };
      btns.forEach(b => b.addEventListener("click", () => pick(Number(b.dataset.k))));
      pick(0);
    } else {
      const pick = k => showMedia(w.episodes[k], w, w.episodes.map((e, i) => [e, i]).filter(x => x[1] !== k), pick);
      pick(0);
    }
  } else {
    showMedia(w, w, null);
  }
  peek.classList.remove("on");
  dlg.showModal(); dlg.scrollTop = 0;
}
/* 내 역할 · 맡은 일 · 자료 링크: 영상보다 먼저 보이게 */
function renderPart(w) {
  const rows = [];
  if (w.role) rows.push(`<div class="lab">Role</div><div class="val role">${esc(w.role)}</div>`);
  if (w.focus || (w.tasks && w.tasks.length)) rows.push(`<div class="lab">My Part</div><div class="val">${w.focus ? `<p class="focus">${esc(w.focus)}</p>` : ""}${(w.tasks || []).length ? `<ul>${w.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}</div>`);
  if (w.credits) rows.push(`<div class="lab">Credits</div><div class="val cr">${esc(w.credits)}</div>`);
  const files = (w.files || []).filter(f => f && f.url);
  if (files.length) rows.push(`<div class="lab">Work Sample</div><div class="val files">${files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.label || "자료")} ↗</a>`).join("")}</div>`);
  $("dPart").innerHTML = rows.join("");
}
function showMedia(w, parent, others, pick) {
  $("dDesc").textContent = w.desc || parent.desc || "";
  dPlayer.classList.toggle("v", !!w.vertical);
  const link = linkOf(w);
  if (w.yt && !framed) {
    dPlayer.innerHTML = `<iframe title="${esc(w.title)}" src="https://www.youtube-nocookie.com/embed/${esc(w.yt)}?rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
  } else if (link) {
    const img = imageOf(w);
    dPlayer.innerHTML = `${img ? `<img alt="" src="${esc(img)}">` : ""}<div class="out"><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">${esc(w.platform || "YouTube")}에서 보기 ↗</a></div>`;
    noImgOnError(dPlayer);
  } else {
    dPlayer.innerHTML = `<div class="out">${esc(w.note || parent.note || "영상 준비 중")}</div>`;
  }
  const take = (key, max) => ((w[key] && w[key].length) ? w[key] : (parent[key] || [])).map(pic).filter(p => p && p.src).slice(0, max);
  /* 메인 영상 옆 칸: 스틸컷(최대 10장, 6장 이상은 두 줄) 또는 다른 편 */
  const media = $("dMedia"), side = $("dSide");
  let cells = [], r = 1, c = 1, ar = 16 / 9;
  if (others && others.length) {
    const allV = others.every(([e]) => e.vertical);
    if (allV) { r = 1; c = others.length; ar = 9 / 16; } else { r = others.length; c = 1; }
    cells = others.map(([e, i]) => { const img = imageOf(e);
      const href = linkOf(e);
      return `<a class="cell${e.vertical && !allV ? " v" : ""}"${href ? ` href="${esc(href)}" target="_blank" rel="noopener"` : ""} aria-label="${esc(e.title)} ${esc(e.platform || "")}에서 보기">${img ? `<img alt="" src="${esc(img)}">` : ""}<span class="et">${esc(e.title)} ↗</span></a>`; });
  } else {
    const st = take("stills", 10);
    r = st.length > 5 ? Math.ceil(st.length / 2) : st.length; c = st.length > 5 ? 2 : 1;
    cells = st.map(p => `<button class="cell still" type="button" data-src="${esc(p.src)}" data-cap="${esc(p.caption || "")}" aria-label="${esc((p.caption || w.title) + " 크게 보기")}"><img alt="" loading="lazy" src="${esc(p.src)}"></button>`);
  }
  media.classList.toggle("solo", !cells.length);
  /* 옆 칸 폭 = 메인 영상 높이에 맞춘 비율 */
  media.style.setProperty("--side-w", ((c * ar) / (r * 16 / 9)).toFixed(3) + "fr");
  media.style.setProperty("--main-w", "1fr");
  side.style.cssText = `--r:${r};--c:${c};--ar:${ar === 1 ? 1 : (ar > 1 ? "16/9" : "9/16")};--mc:${Math.min(cells.length, ar < 1 ? 3 : 4) || 1}`;
  side.innerHTML = cells.join("");
  noImgOnError(side);
  /* 스틸컷 아래: 비하인드 · 작업 자료 (넣은 것만) */
  const rowsOf = items => items.length <= 5 ? [items] : [items.slice(0, Math.ceil(items.length / 2)), items.slice(Math.ceil(items.length / 2))];
  const sets = [["Behind the Scenes", take("behind", 3), ""], ["Process", take("process", 3), "doc"]];
  $("dGal").innerHTML = sets.filter(s => s[1].length).map(([label, items, cls]) => `
    <div class="gal-set"><p class="d-label">${label}</p>${rowsOf(items).map(row => `<div class="stills" style="--n:${row.length}">${row.map(p => `
      <div class="shot"><button class="still ${cls}" type="button" data-src="${esc(p.src)}" data-cap="${esc(p.caption || "")}" aria-label="${esc((p.caption || w.title) + " 크게 보기")}"><img alt="" loading="lazy" src="${esc(p.src)}"></button>${p.caption ? `<span class="shot-cap">${esc(p.caption)}</span>` : ""}</div>`).join("")}</div>`).join("")}</div>`).join("");
  noImgOnError($("dGal"));
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-ref]");
  if (!a || typeof dlg.showModal !== "function") return;
  e.preventDefault();
  openDetail(lookup(a.dataset.ref));
});
$("dClose").addEventListener("click", () => dlg.close());
/* 사진을 누르면 크게 보기 (옆 칸 스틸컷 · 아래 비하인드 모두)
   크게 본 상태에서 좌우 화살표 키 또는 화면 양옆 ‹ › 로 같은 묶음의 앞뒤 사진으로 넘김 */
let lbList = [], lbAt = 0;
const lbShow = i => {
  lbAt = (i + lbList.length) % lbList.length;
  const b = lbList[lbAt];
  $("lbImg").src = b.dataset.src; $("lbCap").textContent = b.dataset.cap || "";
  const many = lbList.length > 1;
  $("lbPrev").hidden = $("lbNext").hidden = !many;
  $("lbCount").textContent = many ? (lbAt + 1) + " / " + lbList.length : "";
};
dlg.addEventListener("click", e => {
  const b = e.target.closest(".still[data-src]");
  if (!b || typeof lb.showModal !== "function") return;
  const group = b.closest(".side, .gal-set") || dlg;
  lbList = [...group.querySelectorAll(".still[data-src]")];
  lbShow(lbList.indexOf(b));
  lb.showModal();
});
$("lbPrev").addEventListener("click", e => { e.stopPropagation(); lbShow(lbAt - 1); });
$("lbNext").addEventListener("click", e => { e.stopPropagation(); lbShow(lbAt + 1); });
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") { e.preventDefault(); lbShow(lbAt - 1); }
  if (e.key === "ArrowRight") { e.preventDefault(); lbShow(lbAt + 1); }
});
/* 휴대폰: 좌우로 밀어서 넘김 */
let lbX = null;
lb.addEventListener("touchstart", e => { lbX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (lbX === null || lbList.length < 2) return;
  const dx = e.changedTouches[0].clientX - lbX; lbX = null;
  if (Math.abs(dx) > 40) lbShow(lbAt + (dx < 0 ? 1 : -1));
});
$("lbClose").addEventListener("click", () => lb.close());
lb.addEventListener("click", e => { if (e.target === lb || e.target.id === "lbImg" || e.target.classList.contains("lb")) lb.close(); });
dlg.addEventListener("close", () => { dPlayer.innerHTML = ""; });
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

/* ============ 문서 자동 생성 ============ */
const todo = t => `<span class="todo">${t}</span>`;
const rRow = (d, main, x) => `<div class="r-row"><span class="d">${esc(d)}</span><span>${main}</span><span class="x">${esc(x || "")}</span></div>`;
const rSec = (h, rows) => `<div class="r-sec"><h3>${h}</h3><div class="r-rows">${rows}</div></div>`;

/* 자격 · 어학: 연도만, 최신 연도순 */
const certRows = keep => S.certificates.filter(keep)
  .map((c, i) => [c, i]).sort((a, b) => String(b[0].date).slice(0, 4) - String(a[0].date).slice(0, 4) || a[1] - b[1])
  .map(([c]) => rRow(String(c.date).slice(0, 4), `<b>${esc(c.name)}</b>${c.detail ? " · " + esc(c.detail) : ""}`)).join("");
function resumeDoc() {
  return `<article class="sheet">
    <div class="r-word">${esc(S.nameEn).replace(" ", "<br>")}</div>
    <div class="r-top">
      <div><div class="r-name">${esc(S.name)}</div><div class="r-sub">${esc(S.role)}</div></div>
      <div></div>
      <div class="r-contact">${esc(S.email)}<br>${esc(S.phone)}${S.instagram ? "<br>@" + esc(S.instagram) : ""}<br>${esc(S.siteUrl)}</div>
    </div>
    ${rSec("학력", S.education.map(e => rRow(e.period, `<b>${esc(e.school)}</b> ${esc(e.major)}${e.second ? "<br>복수전공 / " + esc(e.second) : ""}`, e.gpa ? "학점 " + e.gpa : "")).join(""))}
    ${rSec("경력", works().map(p => rRow(p.period || p.year, `<b>${esc(p.title)}</b>${p.client && !p.title.includes(p.client) ? " · " + esc(p.client) : ""}`, p.format)).join(""))}
    ${rSec("기타 참여", S.archive.map(a => rRow(a.year, `<b>${esc(a.title.replace(/^\[[^\]]+\]\s*/, ""))}</b>${/^\[/.test(a.title) ? " · " + esc(a.title.match(/^\[([^\]]+)\]/)[1]) : ""}`, a.format)).join(""))}
    ${rSec("수상", S.awards.map(a => rRow(a.year, `<b>${esc(a.name)}</b> · ${esc(a.detail)}`)).join(""))}
    ${rSec("자격", certRows(c => !c.lang))}
    ${rSec("어학", certRows(c => c.lang))}
    ${(S.training || []).length ? rSec("교육 이수", S.training.map(t => rRow(t.year, `<b>${esc(t.name)}</b>${t.issuer ? `<span class="s">${esc(t.issuer)}</span>` : ""}`)).join("")) : ""}
    ${rSec("병역", rRow(S.military.period, esc(S.military.detail)))}
    ${rSec("자기소개", (S.aboutMe || []).filter(Boolean).length
      ? S.aboutMe.filter(Boolean).map(t => `<p class="r-p">${esc(t)}</p>`).join("")
      : todo("[content.js의 aboutMe에 두세 문단으로 적으면 여기에 들어갑니다]"))}
  </article>`;
}

function careerEntry(p) {
  const tasks = p.tasks && p.tasks.length ? `${p.focus ? `<b class="c-focus">${esc(p.focus)}</b>` : ""}<ul>${p.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : todo("[content.js의 tasks에 담당 업무를 적으면 여기에 들어갑니다]");
  const eps = p.episodes ? `<dt>구성</dt><dd>${esc(p.episodes.map(e => e.title).join(", "))}</dd>` : "";
  return `<div class="c-entry">
    <div class="c-head"><b>${esc(p.title)}</b><span>${esc(p.period || p.year)}</span></div>
    <div class="c-meta">${esc(join([p.client, p.format, p.role]))}</div>
    <dl class="c-body">${eps}<dt>담당 업무</dt><dd>${tasks}</dd>${p.credits ? `<dt>함께한 사람</dt><dd>${esc(p.credits)}</dd>` : ""}</dl>
  </div>`;
}
function careerDoc() {
  return `<article class="sheet">
    <div class="c-top"><div class="c-title">경력기술서</div><div class="c-who">${esc(S.name)} · ${esc(S.role)}<br>${esc(S.email)}<br>${esc(S.phone)}</div></div>
    <div class="c-group"><h3>주요 작업</h3><div>${sortedWorks().map(([, w]) => careerEntry(w)).join("")}</div></div>
  </article>`;
}

const pImg = (src, cls, label, zoom) => `<div class="${cls}">${src ? `<img alt="" src="${esc(src)}"${zoom ? ` style="transform:scale(${zoom})"` : ""}>` : `<span class="ph-paper">${esc(label)}</span>`}</div>`;
function portfolioPage(p) {
  const text = `<div class="p-text">
    <div class="ttl">${esc(p.title)}</div>
    <div class="meta">
      <span>Client</span><span>${esc(p.client || "YeahFilms")}</span>
      <span>Format</span><span>${esc(p.format)}</span>
      <span>Role</span><span>${esc(p.role)}</span>
      <span>Period</span><span>${esc(p.period || p.year)}</span>
    </div>
    ${p.tasks && p.tasks.length ? `<div class="part"><b>My Part</b>${p.focus ? `<p class="focus">${esc(p.focus)}</p>` : ""}<ul>${p.tasks.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
    <div class="desc">${p.desc ? esc(p.desc) : todo("[content.js의 desc에 작업 소개를 적으면 여기에 들어갑니다]")}</div>
    ${p.credits ? `<div class="cr">${esc(p.credits)}</div>` : ""}
    ${linkOf(p) ? `<div class="link">${esc(linkOf(p))}</div>` : ""}
  </div>`;
  let media;
  if (p.episodes) {
    /* 다른 페이지와 같은 틀: 위쪽 큰 영역(16:9 전체 폭) + 아래 4칸 한 줄, 편 제목은 이미지 위에 */
    const cell = (e, cls, pos) => `<div class="${cls} p-c">${imageOf(e) ? `<img alt="" src="${esc(imageOf(e))}"${pos ? ` style="object-position:${pos}"` : ""}>` : `<span class="ph-paper">${esc((e.yt || e.href) ? (e.platform || "") : (p.note || "공개 예정"))}</span>`}<span class="p-cap">${esc(e.title)}</span></div>`;
    const row4 = (list, pos) => `<div class="p-row" style="grid-template-columns:repeat(4,minmax(0,1fr))">${list.map(e => cell(e, "p-sm", pos)).join("")}</div>`;
    const feats = p.episodes.filter(e => e.feature), verts = p.episodes.filter(e => e.vertical);
    if (feats.length) {
      /* 대표 편은 위 큰 영역을 2×2로 나눠 채우고, 나머지 편은 아래 한 줄 */
      const cols = feats.length === 1 ? 1 : 2;
      media = `<div class="p-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${feats.map(e => cell(e, "p-sm")).join("")}</div>` + row4(p.episodes.filter(e => !e.feature));
    } else if (verts.length) {
      /* 가로 · 세로 편을 2×2 같은 크기 칸에: 세로 숏폼은 잘리지 않게 칸 가운데에 9:16 그대로 */
      media = `<div class="p-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${p.episodes.map(e => cell(e, e.vertical ? "p-sm p-fit" : "p-sm")).join("")}</div>`;
    } else {
      media = `<div class="p-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${p.episodes.map(e => cell(e, "p-sm")).join("")}</div>`;
    }
  } else {
    const st = p.stills || [];
    const srcOf = x => pic(x) && pic(x).src;
    const main = imageOf(p);
    const restSt = st.map(srcOf).filter(s => s && s !== main).slice(0, 4);
    const extra = [...(p.behind || []), ...(p.process || [])].map(srcOf).filter(Boolean).slice(0, 3);
    const rest = restSt.length ? restSt : extra;
    /* 스틸컷이 없으면 대표 이미지만 (빈 자리 칸은 만들지 않음) */
    media = `${pImg(main, "p-main", "대표 이미지", !p.thumb && p.thumbZoom)}${rest.length ? `<div class="p-row" style="grid-template-columns:repeat(4,minmax(0,1fr))">${rest.map(s => pImg(s, "p-sm", "")).join("")}</div>` : ""}`;
  }
  return `<article class="sheet land"><div class="p-page">${text}<div class="p-media">${media}</div></div></article>`;
}
function portfolioDoc() {
  const yr = new Date().getFullYear();
  const cover = `<article class="sheet land"><div class="p-cover">
    <div class="k"><span>Portfolio</span><span>${yr}</span></div>
    <div class="n">${esc(S.nameEn).replace(" ", "<br>")}</div>
    <div class="c"><span>${esc(S.name)}</span><span>${esc(S.role)}</span><span>${esc(S.email)}</span><span>${esc(S.siteUrl)}</span></div>
  </div></article>`;
  return cover + works().map(portfolioPage).join("");
}

/* ============ 화면 전환 ============ */
let autoPrint = false;
function route() {
  const id = location.hash.slice(1);
  const doc = DOCS.find(d => d.id === id);
  if (dlg.open) dlg.close();
  if (!doc) {
    document.body.classList.remove("doc-mode");
    $("docView").hidden = true;
    document.title = S.name + " 포트폴리오";
    const target = id && document.getElementById(id);
    if (target) target.scrollIntoView();
    return;
  }
  document.body.classList.add("doc-mode");
  $("docView").hidden = false;
  $("pageRule").textContent = doc.page;
  document.title = S.name + "_" + doc.ko;
  $("sheets").innerHTML = doc.id === "resume" ? resumeDoc() : doc.id === "career" ? careerDoc() : portfolioDoc();
  noImgOnError($("sheets"));
  document.querySelectorAll(".doc-tabs a").forEach(a => {
    if (a.dataset.doc === doc.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  $("docAction").innerHTML = framed
    ? `<span class="doc-note">실제 사이트에서는 여기에 'PDF로 저장' 버튼이 생겨요</span>`
    : `<button class="btn" type="button" id="printBtn">PDF로 저장 ↓</button>`;
  if (!framed) $("printBtn").addEventListener("click", printNow);
  window.scrollTo(0, 0);
  if (autoPrint) { autoPrint = false; printNow(); }
}
function printNow() {
  const imgs = [...$("sheets").querySelectorAll("img")].filter(i => !i.complete).map(i => new Promise(r => { i.onload = i.onerror = r; }));
  Promise.all([document.fonts ? document.fonts.ready : 0, ...imgs]).then(() => setTimeout(() => window.print(), 150));
}
document.addEventListener("click", e => { if (e.target.closest("a[data-print]") && !framed) autoPrint = true; });
window.addEventListener("hashchange", route);


renderSite();
route();
})();
</script>
